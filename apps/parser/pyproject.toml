[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "afisha-parser"
version = "0.5.7"
description = "Сбор событий из открытых источников в JSON для мини-приложения афиши"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tzdata>=2024.1",  # на Windows без него zoneinfo не знает часовых поясов
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Скачивание файлов трейлеров (AFISHA_TRAILERS_DOWNLOAD=true). Для 720p нужен ещё ffmpeg в системе
trailers = ["yt-dlp>=2025.1"]

[project.scripts]
afisha-parser = "afisha_parser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
